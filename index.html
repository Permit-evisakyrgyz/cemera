<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live AI Camera Studio</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 18px;
  background: #0b1020;
  color: #fff;
  font-family: Arial, sans-serif;
  text-align: center;
}

h1 { color: #60a5fa; }

.panel {
  max-width: 680px;
  margin: auto;
  background: #151e32;
  padding: 16px;
  border-radius: 16px;
}

.camera {
  position: relative;
  width: 100%;
  margin: 15px auto;
  overflow: hidden;
  border-radius: 12px;
  background: #000;
}

video {
  display: block;
  width: 100%;
  height: auto;
  transform: scaleX(-1);
}

canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

select, button {
  padding: 12px;
  margin: 5px;
  border: 0;
  border-radius: 8px;
  font-size: 15px;
}

select {
  max-width: 100%;
  background: #fff;
  color: #111827;
}

button {
  background: #2563eb;
  color: white;
  cursor: pointer;
}

#status {
  color: #fbbf24;
  overflow-wrap: anywhere;
}

.small {
  font-size: 13px;
  color: #b8c4d9;
}
</style>
</head>

<body>
<h1>Live AI Camera Studio</h1>
<p>Select your live face effect</p>

<div class="panel">
  <label for="effect">Choose Effect:</label>
  <br>

  <select id="effect">
    <option value="glasses">Blue Glasses</option>
    <option value="cat">Cat Ears & Nose</option>
    <option value="moustache">Moustache</option>
    <option value="neon">Neon Face Outline</option>
    <option value="none">No Effect</option>
  </select>

  <div class="camera">
    <video id="video" autoplay muted playsinline></video>
    <canvas id="overlay"></canvas>
  </div>

  <button id="start">Start Camera & AI</button>
  <button id="stop">Stop Camera</button>

  <p id="status">Select an effect and start the camera.</p>
  <p class="small">
    Camera runs in your browser. Allow camera access when asked.
  </p>
</div>

<script type="module">
import {
  FaceLandmarker,
  FilesetResolver
} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

const video = document.getElementById("video");
const canvas = document.getElementById("overlay");
const ctx = canvas.getContext("2d");
const status = document.getElementById("status");
const effectMenu = document.getElementById("effect");

let stream = null;
let landmarker = null;
let running = false;
let busy = false;
let lastTime = -1;

function point(p, i, w, h) {
  return {
    x: (1 - p[i].x) * w,
    y: p[i].y * h
  };
}

function line(a, b) {
  ctx.beginPath();
  ctx.moveTo(a.x, a.y);
  ctx.lineTo(b.x, b.y);
  ctx.stroke();
}

function drawGlasses(p, w, h) {
  const a = point(p, 33, w, h);
  const b = point(p, 263, w, h);

  const dx = b.x - a.x;
  const dy = b.y - a.y;
  const d = Math.hypot(dx, dy);
  const angle = Math.atan2(dy, dx);

  ctx.save();
  ctx.translate((a.x + b.x) / 2, (a.y + b.y) / 2);
  ctx.rotate(angle);

  const ew = d * 0.40;
  const eh = d * 0.27;
  const gap = d * 0.04;

  ctx.lineWidth = Math.max(2, d * 0.045);
  ctx.strokeStyle = "#00e5ff";
  ctx.fillStyle = "rgba(0,229,255,0.2)";

  for (const x of [-ew / 2 - gap / 2, ew / 2 + gap / 2]) {
    ctx.beginPath();
    ctx.roundRect(x - ew / 2, -eh / 2, ew, eh, eh * 0.25);
    ctx.fill();
    ctx.stroke();
  }

  ctx.beginPath();
  ctx.moveTo(-gap / 2, 0);
  ctx.lineTo(gap / 2, 0);
  ctx.stroke();
  ctx.restore();
}

function drawCat(p, w, h) {
  const top = point(p, 10, w, h);
  const left = point(p, 234, w, h);
  const right = point(p, 454, w, h);
  const width = Math.hypot(right.x - left.x, right.y - left.y);

  const cx = top.x;
  const cy = top.y + width * 0.06;
  const size = width * 0.23;

  ctx.save();
  ctx.lineJoin = "round";
  ctx.lineWidth = Math.max(2, width * 0.018);
  ctx.strokeStyle = "#ff78c8";
  ctx.fillStyle = "#f472b6";

  for (const side of [-1, 1]) {
    const x = cx + side * width * 0.24;
    const y = cy - width * 0.04;

    ctx.beginPath();
    ctx.moveTo(x - size * 0.55, y);
    ctx.lineTo(x - size * 0.15, y - size);
    ctx.lineTo(x + size * 0.55, y);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = "#ffe4f2";
    ctx.beginPath();
    ctx.moveTo(x - size * 0.28, y - size * 0.10);
    ctx.lineTo(x - size * 0.14, y - size * 0.65);
    ctx.lineTo(x + size * 0.30, y - size * 0.10);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = "#f472b6";
  }

  const nose = point(p, 1, w, h);
  const mw = width * 0.075;

  ctx.fillStyle = "#ff6b9d";
  ctx.beginPath();
  ctx.moveTo(nose.x - mw, nose.y - mw * 0.3);
  ctx.lineTo(nose.x + mw, nose.y - mw * 0.3);
  ctx.lineTo(nose.x, nose.y + mw * 0.6);
  ctx.closePath();
  ctx.fill();

  ctx.restore();
}

function drawMoustache(p, w, h) {
  const left = point(p, 61, w, h);
  const right = point(p, 291, w, h);
  const upperLip = point(p, 13, w, h);
  const width = Math.hypot(right.x - left.x, right.y - left.y);

  ctx.save();
  ctx.fillStyle = "#25202a";

  // Two curved moustache lobes under the nose
  for (const side of [-1, 1]) {
    ctx.save();
    ctx.translate(upperLip.x, upperLip.y + width * 0.015);
    ctx.scale(side, 1);

    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.bezierCurveTo(
      width * 0.16, -width * 0.08,
      width * 0.30, -width * 0.04,
      width * 0.47, width * 0.02
    );
    ctx.bezierCurveTo(
      width * 0.34, width * 0.20,
      width * 0.12, width * 0.13,
      0, width * 0.07
    );
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  ctx.restore();
}

function drawNeon(p, w, h) {
  const outline = [
    10, 338, 297, 332, 284, 251, 389, 356,
    454, 323, 361, 288, 397, 365, 379, 378,
    400, 377, 152, 148, 176, 149, 150, 136,
    172, 58, 132, 93, 234, 127
  ];

  ctx.save();
  ctx.beginPath();

  outline.forEach((idx, i) => {
    const q = point(p, idx, w, h);
    if (i === 0) ctx.moveTo(q.x, q.y);
    else ctx.lineTo(q.x, q.y);
  });

  ctx.closePath();
  ctx.strokeStyle = "#00f5ff";
  ctx.lineWidth = 3;
  ctx.shadowColor = "#00f5ff";
  ctx.shadowBlur = 16;
  ctx.stroke();

  ctx.shadowBlur = 0;
  ctx.fillStyle = "rgba(0,245,255,0.06)";
  ctx.fill();
  ctx.restore();
}

async function startCamera() {
  if (running || busy) return;
  busy = true;

  try {
    status.textContent = "Loading AI model...";

    if (!landmarker) {
      const vision = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
      );

      landmarker = await FaceLandmarker.createFromOptions(vision, {
        baseOptions: {
          modelAssetPath:
            "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
          delegate: "CPU"
        },
        runningMode: "VIDEO",
        numFaces: 1
      });
    }

    status.textContent = "Requesting camera permission...";

    stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: {
        facingMode: "user",
        width: { ideal: 640 },
        height: { ideal: 480 }
      }
    });

    video.srcObject = stream;
    await video.play();

    running = true;
    lastTime = -1;
    status.textContent = "Camera and AI are running.";
    requestAnimationFrame(drawFrame);

  } catch (err) {
    status.textContent = "Error: " + err.message;

    if (stream) {
      stream.getTracks().forEach(t => t.stop());
    }

    stream = null;
    video.srcObject = null;
    running = false;
  } finally {
    busy = false;
  }
}

function drawFrame() {
  if (!running) return;

  if (video.readyState >= 2 && video.currentTime !== lastTime) {
    lastTime = video.currentTime;

    const w = video.videoWidth;
    const h = video.videoHeight;

    if (canvas.width !== w || canvas.height !== h) {
      canvas.width = w;
      canvas.height = h;
    }

    ctx.clearRect(0, 0, w, h);

    try {
      const result = landmarker.detectForVideo(
        video, performance.now()
      );

      const face = result.faceLandmarks?.[0];

      if (!face) {
        status.textContent = "Looking for your face...";
      } else {
        status.textContent = "Face detected • " +
          effectMenu.options[effectMenu.selectedIndex].text;

        switch (effectMenu.value) {
          case "glasses":
            drawGlasses(face, w, h);
            break;
          case "cat":
            drawCat(face, w, h);
            break;
          case "moustache":
            drawMoustache(face, w, h);
            break;
          case "neon":
            drawNeon(face, w, h);
            break;
        }
      }
    } catch (err) {
      status.textContent = "Tracking error: " + err.message;
    }
  }

  requestAnimationFrame(drawFrame);
}

document.getElementById("start").onclick = startCamera;

document.getElementById("stop").onclick = () => {
  running = false;

  if (stream) stream.getTracks().forEach(t => t.stop());

  stream = null;
  video.srcObject = null;
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  status.textContent = "Camera stopped.";
};
</script>
</body>
</html>
