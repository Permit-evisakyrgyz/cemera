<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live AI Camera Studio</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#10131c;color:#fff;font-family:Arial,sans-serif;padding:16px}
h1{text-align:center;font-size:25px}
.app{max-width:850px;margin:auto}
.preview{position:relative;background:#000;border-radius:14px;overflow:hidden;min-height:220px}
video,canvas{display:block;width:100%;height:auto}
video{transform:scaleX(-1)}
#overlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
button,select{padding:13px;border:0;border-radius:9px;font-size:15px}
button{background:#6957e8;color:white;font-weight:bold}
button:active{opacity:.7}
button:disabled{opacity:.45}
select{background:#242938;color:#fff;width:100%}
.status{padding:12px;background:#202635;border-radius:9px;margin-top:12px;overflow-wrap:anywhere}
label{display:block;margin:12px 0 6px}
input[type=range]{width:100%}
.full{grid-column:1/-1}
#photo{width:100%;margin-top:12px;border-radius:10px}
small{color:#c4c9d6}
</style>
</head>
<body>
<div class="app">
<h1>Live AI Camera Studio</h1>

<div class="preview">
<video id="video" autoplay playsinline muted></video>
<canvas id="overlay"></canvas>
</div>

<div class="status" id="status">Camera is not started.</div>

<div class="controls">
<button id="start">Start Camera</button>
<button id="switch">Switch Camera</button>

<select id="effect" aria-label="Choose effect">
<option value="none">No Effect</option>
<option value="glasses">Glasses</option>
<option value="cat">Cat Ears</option>
<option value="mustache">Mustache</option>
<option value="neon">Neon Face Frame</option>
</select>

<select id="resolution" aria-label="Camera resolution">
<option value="480">480p</option>
<option value="720" selected>720p</option>
<option value="360">360p</option>
</select>

<button id="photoBtn">Take Photo</button>
<button id="recordBtn">Start Recording</button>
<button id="reset">Reset Settings</button>
<button id="stop">Stop Camera</button>
</div>

<label for="brightness">Brightness: <span id="bv">100%</span></label>
<input id="brightness" type="range" min="50" max="150" value="100">

<label for="contrast">Contrast: <span id="cv">100%</span></label>
<input id="contrast" type="range" min="50" max="150" value="100">

<p><small>Photo saves as PNG. Video saves as WebM. Video recording does not include audio.</small></p>
<img id="photo" alt="Captured photo preview" hidden>
<a id="download" hidden>Download photo</a>
</div>

<script>
(function(){
"use strict";

const video = document.getElementById("video");
const overlay = document.getElementById("overlay");
const ctx = overlay.getContext("2d");
const status = document.getElementById("status");

const startBtn = document.getElementById("start");
const switchBtn = document.getElementById("switch");
const photoBtn = document.getElementById("photoBtn");
const recordBtn = document.getElementById("recordBtn");
const resetBtn = document.getElementById("reset");
const stopBtn = document.getElementById("stop");

const effect = document.getElementById("effect");
const resolution = document.getElementById("resolution");
const brightness = document.getElementById("brightness");
const contrast = document.getElementById("contrast");
const photo = document.getElementById("photo");
const download = document.getElementById("download");

let stream = null;
let facing = "user";
let recorder = null;
let chunks = [];
let recording = false;
let frameId = null;

function say(message){
  status.textContent = message;
}

function resizeCanvas(){
  const w = video.videoWidth || 640;
  const h = video.videoHeight || 480;
  if(overlay.width !== w) overlay.width = w;
  if(overlay.height !== h) overlay.height = h;
}

function draw(){
  if(!video.videoWidth){
    frameId = requestAnimationFrame(draw);
    return;
  }

  resizeCanvas();
  ctx.clearRect(0,0,overlay.width,overlay.height);

  const w = overlay.width;
  const h = overlay.height;
  const name = effect.value;

  ctx.save();
  ctx.translate(w,0);
  ctx.scale(-1,1);
  ctx.strokeStyle = "#00f5ff";
  ctx.fillStyle = "#00f5ff";
  ctx.lineWidth = Math.max(3,w/180);

  if(name === "glasses"){
    const y = h * .37;
    const x1 = w * .35;
    const x2 = w * .65;
    const r = w * .075;
    ctx.strokeStyle = "#00eaff";
    ctx.beginPath();
    ctx.arc(x1,y,r,0,Math.PI*2);
    ctx.arc(x2,y,r,0,Math.PI*2);
    ctx.moveTo(x1+r,y);
    ctx.lineTo(x2-r,y);
    ctx.stroke();
  } else if(name === "cat"){
    ctx.fillStyle = "#ff75d8";
    ctx.beginPath();
    ctx.moveTo(w*.34,h*.29);
    ctx.lineTo(w*.28,h*.12);
    ctx.lineTo(w*.43,h*.25);
    ctx.closePath();
    ctx.moveTo(w*.57,h*.25);
    ctx.lineTo(w*.72,h*.12);
    ctx.lineTo(w*.66,h*.29);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.arc(w*.46,h*.42,w*.012,0,Math.PI*2);
    ctx.arc(w*.54,h*.42,w*.012,0,Math.PI*2);
    ctx.fill();
  } else if(name === "mustache"){
    ctx.fillStyle = "#24202a";
    ctx.beginPath();
    ctx.ellipse(w*.46,h*.53,w*.065,h*.025,-.15,0,Math.PI*2);
    ctx.ellipse(w*.54,h*.53,w*.065,h*.025,.15,0,Math.PI*2);
    ctx.fill();
  } else if(name === "neon"){
    ctx.strokeStyle = "#00ff9d";
    ctx.shadowColor = "#00ff9d";
    ctx.shadowBlur = 18;
    ctx.beginPath();
    ctx.ellipse(w*.5,h*.43,w*.19,h*.29,0,0,Math.PI*2);
    ctx.stroke();
  }

  ctx.restore();
  frameId = requestAnimationFrame(draw);
}

async function startCamera(){
  try{
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      throw new Error("Camera needs HTTPS and a supported browser.");
    }

    if(stream){
      stream.getTracks().forEach(track=>track.stop());
      stream = null;
    }

    if(frameId){
      cancelAnimationFrame(frameId);
      frameId = null;
    }

    say("Starting camera...");

    const height = Number(resolution.value);
    stream = await navigator.mediaDevices.getUserMedia({
      audio:false,
      video:{
        facingMode:{ideal:facing},
        width:{ideal:height*4/3},
        height:{ideal:height}
      }
    });

    video.srcObject = stream;
    await video.play();

    startBtn.textContent = "Restart Camera";
    say("Camera is running.");
    if(!frameId) draw();
  }catch(error){
    say("Camera error: " + error.message);
  }
}

function stopCamera(){
  if(recording && recorder && recorder.state !== "inactive"){
    recorder.stop();
  }

  if(stream){
    stream.getTracks().forEach(track=>track.stop());
    stream = null;
  }

  if(frameId){
    cancelAnimationFrame(frameId);
    frameId = null;
  }

  video.srcObject = null;
  ctx.clearRect(0,0,overlay.width,overlay.height);
  say("Camera stopped.");
}

startBtn.addEventListener("click",startCamera);

switchBtn.addEventListener("click",async()=>{
  facing = facing === "user" ? "environment" : "user";
  await startCamera();
});

stopBtn.addEventListener("click",stopCamera);

photoBtn.addEventListener("click",()=>{
  if(!video.videoWidth){
    say("Start the camera first.");
    return;
  }

  const out = document.createElement("canvas");
  out.width = video.videoWidth;
  out.height = video.videoHeight;
  const c = out.getContext("2d");

  c.filter = `brightness(${brightness.value}%) contrast(${contrast.value}%)`;
  c.translate(out.width,0);
  c.scale(-1,1);
  c.drawImage(video,0,0,out.width,out.height);
  c.filter = "none";

  // Add the current effect overlay to the saved photo.
  c.drawImage(overlay,0,0,out.width,out.height);

  const url = out.toDataURL("image/png");
  photo.src = url;
  photo.hidden = false;
  download.href = url;
  download.download = "live-ai-photo.png";
  download.textContent = "Download Photo";
  download.hidden = false;
  say("Photo captured. Tap Download Photo to save it.");
});

recordBtn.addEventListener("click",()=>{
  if(recording){
    if(recorder && recorder.state !== "inactive") recorder.stop();
    return;
  }

  if(!video.videoWidth){
    say("Start the camera first.");
    return;
  }

  try{
    const out = document.createElement("canvas");
    out.width = video.videoWidth;
    out.height = video.videoHeight;
    const c = out.getContext("2d");

    function recordFrame(){
      if(!recording) return;
      c.filter = `brightness(${brightness.value}%) contrast(${contrast.value}%)`;
      c.save();
      c.translate(out.width,0);
      c.scale(-1,1);
      c.drawImage(video,0,0,out.width,out.height);
      c.restore();
      c.filter = "none";
      c.drawImage(overlay,0,0,out.width,out.height);
      requestAnimationFrame(recordFrame);
    }

    recording = true;
    recordFrame();

    const recordStream = out.captureStream(24);
    const mime = MediaRecorder.isTypeSupported("video/webm;codecs=vp8")
      ? "video/webm;codecs=vp8" : "video/webm";

    recorder = new MediaRecorder(recordStream,{mimeType:mime});
    chunks = [];

    recorder.ondataavailable = e=>{
      if(e.data && e.data.size) chunks.push(e.data);
    };

    recorder.onstop = ()=>{
      recording = false;
      recordBtn.textContent = "Start Recording";

      if(chunks.length){
        const blob = new Blob(chunks,{type:"video/webm"});
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "live-ai-video.webm";
        a.click();
        setTimeout(()=>URL.revokeObjectURL(url),60000);
        say("Recording saved as a WebM video.");
      }
    };

    recorder.start();
    recordBtn.textContent = "Stop Recording";
    say("Recording video...");
  }catch(error){
    recording = false;
    say("Recording error: " + error.message);
  }
});

brightness.addEventListener("input",()=>{
  document.getElementById("bv").textContent = brightness.value + "%";
  video.style.filter = `brightness(${brightness.value}%) contrast(${contrast.value}%)`;
});

contrast.addEventListener("input",()=>{
  document.getElementById("cv").textContent = contrast.value + "%";
  video.style.filter = `brightness(${brightness.value}%) contrast(${contrast.value}%)`;
});

resetBtn.addEventListener("click",()=>{
  effect.value = "none";
  resolution.value = "720";
  brightness.value = "100";
  contrast.value = "100";
  document.getElementById("bv").textContent = "100%";
  document.getElementById("cv").textContent = "100%";
  video.style.filter = "none";
  photo.hidden = true;
  download.hidden = true;
  say("Settings reset.");
});

resolution.addEventListener("change",()=>{
  if(stream) startCamera();
});

window.addEventListener("pagehide",()=>{
  if(stream) stream.getTracks().forEach(track=>track.stop());
});
})();
</script>
</body>
</html>
