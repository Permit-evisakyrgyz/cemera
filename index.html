<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live AI Camera Studio</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 16px;
  background: #0b1020;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

h1 { color: #60a5fa; }

.panel {
  max-width: 680px;
  margin: auto;
  padding: 16px;
  background: #151e32;
  border-radius: 16px;
}

.camera {
  position: relative;
  width: 100%;
  margin: 15px auto;
  overflow: hidden;
  border-radius: 12px;
  background: black;
}

video, #overlay {
  display: block;
  width: 100%;
}

#overlay {
  position: absolute;
  inset: 0;
  height: 100%;
  pointer-events: none;
}

select, button {
  padding: 12px;
  margin: 5px;
  border: 0;
  border-radius: 8px;
  font-size: 15px;
}

select { max-width: 100%; }

button {
  background: #2563eb;
  color: white;
  cursor: pointer;
}

button:disabled {
  opacity: .5;
  cursor: not-allowed;
}

#status {
  color: #fbbf24;
  overflow-wrap: anywhere;
}

#recordStatus { color: #fb7185; }

.small {
  font-size: 13px;
  color: #b8c4d9;
}
</style>
</head>
<body>

<h1>Live AI Camera Studio</h1>
<p>Live Effects • Photo • Video Recording</p>

<div class="panel">
  <label for="effect">Choose Face Effect:</label><br>

  <select id="effect">
    <option value="glasses">Blue Glasses</option>
    <option value="cat">Cat Ears & Nose</option>
    <option value="moustache">Moustache</option>
    <option value="neon">Neon Face</option>
    <option value="none">No Effect</option>
  </select>

  <div class="camera">
    <video id="video" autoplay muted playsinline></video>
    <canvas id="overlay"></canvas>
  </div>

  <button id="start">Start Camera & AI</button>
  <button id="stop" disabled>Stop Camera</button>
  <hr>

  <button id="photo" disabled>📸 Take Photo</button>
  <button id="record" disabled>🔴 Start Recording</button>
  <button id="stopRecord" disabled>Stop Recording</button>

  <p id="status">Start the camera to begin.</p>
  <p id="recordStatus"></p>
  <p class="small">
    Photos are saved as PNG. Videos are saved as WebM.
    Allow camera access when asked.
  </p>
</div>

<script type="module">
import {
  FaceLandmarker,
  FilesetResolver
} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

const video = document.getElementById("video");
const overlay = document.getElementById("overlay");
const ctx = overlay.getContext("2d");
const status = document.getElementById("status");
const recordStatus = document.getElementById("recordStatus");
const effectMenu = document.getElementById("effect");

const photoBtn = document.getElementById("photo");
const recordBtn = document.getElementById("record");
const stopRecordBtn = document.getElementById("stopRecord");
const startBtn = document.getElementById("start");
const stopBtn = document.getElementById("stop");

const output = document.createElement("canvas");
const outCtx = output.getContext("2d");

let stream = null;
let landmarker = null;
let running = false;
let busy = false;
let recorder = null;
let recordedChunks = [];
let lastTime = -1;
let recordingStream = null;

function point(p, i, w, h) {
  return {
    x: (1 - p[i].x) * w,
    y: p[i].y * h
  };
}

function drawGlasses(p, w, h) {
  const a = point(p, 33, w, h);
  const b = point(p, 263, w, h);
  const dx = b.x - a.x;
  const dy = b.y - a.y;
  const d = Math.hypot(dx, dy);

  ctx.save();
  ctx.translate((a.x + b.x) / 2, (a.y + b.y) / 2);
  ctx.rotate(Math.atan2(dy, dx));

  const ew = d * 0.40;
  const eh = d * 0.27;
  const gap = d * 0.04;

  ctx.lineWidth = Math.max(2, d * 0.045);
  ctx.strokeStyle = "#00e5ff";
  ctx.fillStyle = "rgba(0,229,255,0.2)";

  for (const x of [-ew / 2 - gap / 2, ew / 2 + gap / 2]) {
    ctx.beginPath();
    ctx.roundRect(x - ew / 2, -eh / 2, ew, eh, eh * .25);
    ctx.fill();
    ctx.stroke();
  }

  ctx.beginPath();
  ctx.moveTo(-gap / 2, 0);
  ctx.lineTo(gap / 2, 0);
  ctx.stroke();
  ctx.restore();
}

function drawCat(p, w, h) {
  const top = point(p, 10, w, h);
  const left = point(p, 234, w, h);
  const right = point(p, 454, w, h);
  const width = Math.hypot(right.x - left.x, right.y - left.y);
  const size = width * .23;
  const cx = top.x;
  const cy = top.y + width * .06;

  ctx.save();
  ctx.lineJoin = "round";
  ctx.lineWidth = Math.max(2, width * .018);
  ctx.strokeStyle = "#ff78c8";
  ctx.fillStyle = "#f472b6";

  for (const side of [-1, 1]) {
    const x = cx + side * width * .24;
    const y = cy - width * .04;

    ctx.beginPath();
    ctx.moveTo(x - size * .55, y);
    ctx.lineTo(x - size * .15, y - size);
    ctx.lineTo(x + size * .55, y);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = "#ffe4f2";
    ctx.beginPath();
    ctx.moveTo(x - size * .28, y - size * .10);
    ctx.lineTo(x - size * .14, y - size * .65);
    ctx.lineTo(x + size * .30, y - size * .10);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = "#f472b6";
  }

  const nose = point(p, 1, w, h);
  const mw = width * .075;
  ctx.fillStyle = "#ff6b9d";
  ctx.beginPath();
  ctx.moveTo(nose.x - mw, nose.y - mw * .3);
  ctx.lineTo(nose.x + mw, nose.y - mw * .3);
  ctx.lineTo(nose.x, nose.y + mw * .6);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawMoustache(p, w, h) {
  const left = point(p, 61, w, h);
  const right = point(p, 291, w, h);
  const lip = point(p, 13, w, h);
  const width = Math.hypot(right.x - left.x, right.y - left.y);

  ctx.save();
  ctx.fillStyle = "#25202a";

  for (const side of [-1, 1]) {
    ctx.save();
    ctx.translate(lip.x, lip.y + width * .015);
    ctx.scale(side, 1);
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.bezierCurveTo(
      width * .16, -width * .08,
      width * .30, -width * .04,
      width * .47, width * .02
    );
    ctx.bezierCurveTo(
      width * .34, width * .20,
      width * .12, width * .13,
      0, width * .07
    );
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  ctx.restore();
}

function drawNeon(p, w, h) {
  const outline = [
    10, 338, 297, 332, 284, 251, 389, 356,
    454, 323, 361, 288, 397, 365, 379, 378,
    400, 377, 152, 148, 176, 149, 150, 136,
    172, 58, 132, 93, 234, 127
  ];

  ctx.save();
  ctx.beginPath();

  outline.forEach((idx, i) => {
    const q = point(p, idx, w, h);
    if (i === 0) ctx.moveTo(q.x, q.y);
    else ctx.lineTo(q.x, q.y);
  });

  ctx.closePath();
  ctx.strokeStyle = "#00f5ff";
  ctx.lineWidth = 3;
  ctx.shadowColor = "#00f5ff";
  ctx.shadowBlur = 16;
  ctx.stroke();
  ctx.shadowBlur = 0;
  ctx.fillStyle = "rgba(0,245,255,.06)";
  ctx.fill();
  ctx.restore();
}

// Composite the mirrored camera and transparent effects.
// This same canvas is used for both photos and video.
function renderOutput() {
  const w = video.videoWidth;
  const h = video.videoHeight;
  if (!w || !h) return;

  if (output.width !== w || output.height !== h) {
    output.width = w;
    output.height = h;
  }

  outCtx.clearRect(0, 0, w, h);

  outCtx.save();
  outCtx.translate(w, 0);
  outCtx.scale(-1, 1);
  outCtx.drawImage(video, 0, 0, w, h);
  outCtx.restore();

  outCtx.drawImage(overlay, 0, 0, w, h);
}

async function startCamera() {
  if (running || busy) return;
  busy = true;
  startBtn.disabled = true;

  try {
    status.textContent = "Loading AI model...";

    if (!landmarker) {
      const vision = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
      );

      landmarker = await FaceLandmarker.createFromOptions(vision, {
        baseOptions: {
          modelAssetPath:
            "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
          delegate: "CPU"
        },
        runningMode: "VIDEO",
        numFaces: 1
      });
    }

    status.textContent = "Requesting camera permission...";

    stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: {
        facingMode: "user",
        width: { ideal: 640 },
        height: { ideal: 480 }
      }
    });

    video.srcObject = stream;
    await video.play();

    running = true;
    lastTime = -1;
    stopBtn.disabled = false;
    photoBtn.disabled = false;
    recordBtn.disabled = false;
    status.textContent = "Camera and AI are running.";
    requestAnimationFrame(drawFrame);

  } catch (err) {
    status.textContent = "Error: " + err.message;
    if (stream) stream.getTracks().forEach(t => t.stop());
    stream = null;
    startBtn.disabled = false;
  } finally {
    busy = false;
  }
}

function drawFrame() {
  if (!running) return;

  if (video.readyState >= 2 && video.currentTime !== lastTime) {
    lastTime = video.currentTime;

    const w = video.videoWidth;
    const h = video.videoHeight;

    if (overlay.width !== w || overlay.height !== h) {
      overlay.width = w;
      overlay.height = h;
    }

    ctx.clearRect(0, 0, w, h);

    try {
      const result = landmarker.detectForVideo(video, performance.now());
      const face = result.faceLandmarks?.[0];

      if (!face) {
        status.textContent = "Looking for your face...";
      } else {
        status.textContent = "Face detected • " +
          effectMenu.options[effectMenu.selectedIndex].text;

        switch (effectMenu.value) {
          case "glasses": drawGlasses(face, w, h); break;
          case "cat": drawCat(face, w, h); break;
          case "moustache": drawMoustache(face, w, h); break;
          case "neon": drawNeon(face, w, h); break;
        }
      }

      renderOutput();

    } catch (err) {
      status.textContent = "Tracking error: " + err.message;
    }
  }

  requestAnimationFrame(drawFrame);
}

function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 30000);
}

photoBtn.onclick = () => {
  if (!running || !output.width) return;

  renderOutput();
  output.toBlob(blob => {
    if (!blob) {
      status.textContent = "Could not create photo.";
      return;
    }
    downloadBlob(blob, "live-ai-photo.png");
    status.textContent = "Photo downloaded.";
  }, "image/png");
};

recordBtn.onclick = () => {
  if (!running || recorder) return;

  if (!window.MediaRecorder || !output.captureStream) {
    recordStatus.textContent = "Video recording is not supported by this browser.";
    return;
  }

  try {
    renderOutput();
    recordedChunks = [];
    recordingStream = output.captureStream(30);

    let options = {};
    if (MediaRecorder.isTypeSupported("video/webm;codecs=vp8")) {
      options.mimeType = "video/webm;codecs=vp8";
    } else if (MediaRecorder.isTypeSupported("video/webm")) {
      options.mimeType = "video/webm";
    }

    recorder = new MediaRecorder(recordingStream, options);

    recorder.ondataavailable = event => {
      if (event.data && event.data.size > 0) {
        recordedChunks.push(event.data);
      }
    };

    recorder.onerror = () => {
      recordStatus.textContent = "Recording error. Please try again.";
    };

    recorder.onstop = () => {
      const blob = new Blob(recordedChunks, {
        type: recorder.mimeType || "video/webm"
      });

      if (blob.size > 0) {
        downloadBlob(blob, "live-ai-video.webm");
        recordStatus.textContent = "Video ready to download.";
      } else {
        recordStatus.textContent = "No video data was recorded.";
      }

      if (recordingStream) {
        recordingStream.getTracks().forEach(t => t.stop());
      }

      recordingStream = null;
      recorder = null;
      recordBtn.disabled = !running;
      stopRecordBtn.disabled = true;
    };

    recorder.start(1000);
    recordBtn.disabled = true;
    stopRecordBtn.disabled = false;
    recordStatus.textContent = "🔴 Recording...";

  } catch (err) {
    if (recordingStream) {
      recordingStream.getTracks().forEach(t => t.stop());
    }
    recordingStream = null;
    recorder = null;
    recordStatus.textContent = "Recording error: " + err.message;
  }
};

stopRecordBtn.onclick = () => {
  if (recorder && recorder.state !== "inactive") {
    recordStatus.textContent = "Preparing your video...";
    recorder.stop();
  }
};

stopBtn.onclick = () => {
  running = false;

  if (recorder && recorder.state !== "inactive") {
    recorder.stop();
  }

  if (stream) stream.getTracks().forEach(t => t.stop());

  stream = null;
  video.srcObject = null;
  ctx.clearRect(0, 0, overlay.width, overlay.height);
  outCtx.clearRect(0, 0, output.width, output.height);

  photoBtn.disabled = true;
  recordBtn.disabled = true;
  stopBtn.disabled = true;
  startBtn.disabled = false;

  status.textContent = "Camera stopped.";
};

startBtn.onclick = startCamera;
</script>
</body>
</html>
